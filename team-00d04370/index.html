<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https://axthhcadtqvtgjxkwcpu.supabase.co; connect-src https://axthhcadtqvtgjxkwcpu.supabase.co; base-uri 'none'; form-action 'none'" />
  <title>Hingtam Admin</title>
  <style>
    :root {
      --bg: #101119;
      --surface: #191a26;
      --surface-2: #222335;
      --border: #2c2e44;
      --text: #f1f1f6;
      --muted: #9a9cb4;
      --accent: #9542ee;
      --danger: #ef4444;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand .mark {
      width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--accent);
      display: grid; place-items: center; font-size: 14px; color: #fff;
    }
    .brand small { color: var(--muted); font-weight: 500; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 24px 80px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px;
    }
    .narrow { max-width: 400px; margin: 10vh auto 0; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p.sub { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 10px; font: inherit;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 999px;
      padding: 9px 18px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
    button:disabled { opacity: .5; cursor: default; }
    .full { width: 100%; margin-top: 20px; }
    .error { color: var(--danger); margin-top: 14px; min-height: 1.2em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .row {
      display: flex; align-items: center; gap: 16px; padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: 0; }
    .avatar {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none;
      background: var(--surface-2); display: grid; place-items: center; color: var(--muted);
    }
    .info { flex: 1; min-width: 0; }
    .info strong { display: block; font-size: 16px; }
    .info span { color: var(--muted); font-size: 13.5px; }
    .actions { display: flex; gap: 8px; flex: none; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .qr { background: #fff; border-radius: 10px; padding: 10px; width: 200px; margin: 14px auto 0; }
    .qr img { width: 100%; display: block; }
    code { background: var(--bg); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    dialog {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; max-width: 400px;
    }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    select {
      width: 100%; padding: 11px 12px; border-radius: 10px; font: inherit;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
    }
    label.check { display: flex; gap: 10px; align-items: flex-start; color: var(--text); font-size: 14px; margin: 16px 0 12px; }
    label.check input { width: auto; margin-top: 3px; }
    #banbox { max-width: 440px; }
    button.back { margin-bottom: 14px; }
    .detail h1 { font-size: 24px; }
    .detail .section { margin-top: 26px; }
    .detail h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    .photos { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .photos img { height: 200px; width: auto; border-radius: 12px; display: block; background: var(--surface-2); }
    .text { white-space: pre-wrap; margin: 0 0 8px; overflow-wrap: anywhere; }
    .prompt small { color: var(--muted); }
    .list .line { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .list .line:last-child { border-bottom: 0; }
    .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 420px; overflow-y: auto; }
    .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .bubble small { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
    .bubble.me { align-self: flex-start; background: var(--surface-2); }
    .bubble.them { align-self: flex-end; background: #3a1f5e; }
    .actions.wide { margin-top: 28px; justify-content: flex-end; flex-wrap: wrap; }
    @media (max-width: 560px) {
      .row { flex-wrap: wrap; }
      .actions { width: 100%; }
      .actions button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="mark">H</div><span>Hingtam <small>Admin</small></span></div>
    <button id="signout" hidden>Sign out</button>
  </header>
  <main id="app"></main>
  <div class="toast" id="toast" role="status"></div>

  <dialog id="confirm">
    <h1 id="confirm-title"></h1>
    <p class="sub" id="confirm-text"></p>
    <div class="btns">
      <button id="confirm-cancel">Cancel</button>
      <button id="confirm-ok" class="danger">Confirm</button>
    </div>
  </dialog>

  <dialog id="banbox">
    <h1 id="ban-title"></h1>
    <p class="sub">The person gets an email with this reason and how to appeal (90 days, support@hingtam.com). They will not be told who reported them.</p>
    <label for="ban-reason">Reason to tell them</label>
    <select id="ban-reason"></select>
    <label class="check"><input type="checkbox" id="ban-skip" /> Do not send an email (for example, if telling them could put someone at risk)</label>
    <p class="sub">They cannot sign in again. You can undo this from the Banned users tab.</p>
    <div class="btns">
      <button id="ban-cancel">Cancel</button>
      <button id="ban-ok" class="danger">Ban</button>
    </div>
  </dialog>

  <script src="supabase.min.js"></script>
  <script>
    // The publishable (anon) key is public by design -- it only identifies the
    // project. Everything sensitive is enforced server-side: the database
    // functions and edge functions refuse anyone who isn't a listed admin on a
    // two-step-verified session.
    const SUPABASE_URL = 'https://axthhcadtqvtgjxkwcpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vwhpL39zscfe8DsUQ6z-uw_aT3BiSya';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
    });

    const REASON_LABELS = {
      spam: 'Spam or scam',
      inappropriate_content: 'Inappropriate content or messages',
      fake_profile: 'Fake or stolen photos',
      harassment: 'Harassing or abusive behavior',
      other: 'Something else',
    };

    const app = document.getElementById('app');
    const signoutBtn = document.getElementById('signout');
    const toastEl = document.getElementById('toast');

    // Tiny DOM builder. Text always goes in via textContent, never innerHTML,
    // because names and reasons come from other users.
    function h(tag, props = {}, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
      }
      for (const c of children.flat()) {
        if (c == null || c === false) continue;
        el.append(c instanceof Node ? c : document.createTextNode(String(c)));
      }
      return el;
    }
    function render(...nodes) { app.replaceChildren(...nodes); }

    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
    }

    function confirmDialog(title, text, okLabel) {
      return new Promise((resolve) => {
        const dlg = document.getElementById('confirm');
        document.getElementById('confirm-title').textContent = title;
        document.getElementById('confirm-text').textContent = text;
        const ok = document.getElementById('confirm-ok');
        const cancel = document.getElementById('confirm-cancel');
        ok.textContent = okLabel;
        const done = (v) => { dlg.close(); ok.onclick = cancel.onclick = null; resolve(v); };
        ok.onclick = () => done(true);
        cancel.onclick = () => done(false);
        dlg.oncancel = () => done(false);
        dlg.showModal();
      });
    }

    // ---- Sign in ----------------------------------------------------------
    function showLogin(message) {
      signoutBtn.hidden = true;
      const email = h('input', { type: 'email', autocomplete: 'username', required: true });
      const password = h('input', { type: 'password', autocomplete: 'current-password', required: true });
      const err = h('div', { class: 'error' }, message || '');
      const btn = h('button', { class: 'primary full', type: 'submit' }, 'Sign in');
      const form = h('form', {
        onsubmit: async (e) => {
          e.preventDefault();
          btn.disabled = true; err.textContent = '';
          const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
          btn.disabled = false;
          if (error) { err.textContent = 'Those details did not work.'; return; }
          route();
        },
      },
        h('label', {}, 'Email'), email,
        h('label', {}, 'Password'), password,
        btn, err);
      render(h('div', { class: 'card narrow' },
        h('h1', {}, 'Admin sign in'),
        h('p', { class: 'sub' }, 'Authorised staff only.'),
        form));
    }

    // ---- Two-step verification -------------------------------------------
    async function showMfa() {
      const { data: factors, error } = await sb.auth.mfa.listFactors();
      if (error) { showLogin('Could not load verification. Please sign in again.'); return; }
      const verified = (factors.totp || []).find((f) => f.status === 'verified');
      if (verified) return showChallenge(verified.id);
      // Drop any half-finished enrolment so we can start clean.
      for (const f of factors.totp || []) await sb.auth.mfa.unenroll({ factorId: f.id });
      return showEnroll();
    }

    async function verifyCode(factorId, code) {
      const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId });
      if (chErr) return chErr;
      const { error } = await sb.auth.mfa.verify({ factorId, challengeId: ch.id, code });
      return error;
    }

    function codeForm(label, onSubmit) {
      const code = h('input', { inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', pattern: '[0-9]{6}', required: true });
      const err = h('div', { class: 'error' });
      const btn = h('button', { class: 'primary full', type: 'submit' }, label);
      const form = h('form', {
        onsubmit: async (e) => {
          e.preventDefault();
          btn.disabled = true; err.textContent = '';
          const problem = await onSubmit(code.value.trim());
          btn.disabled = false;
          if (problem) err.textContent = 'That code did not work. Try the newest one.';
        },
      }, h('label', {}, '6-digit code'), code, btn, err);
      setTimeout(() => code.focus(), 0);
      return form;
    }

    function showChallenge(factorId) {
      render(h('div', { class: 'card narrow' },
        h('h1', {}, 'Two-step check'),
        h('p', { class: 'sub' }, 'Enter the code from your authenticator app.'),
        codeForm('Verify', async (code) => {
          const err = await verifyCode(factorId, code);
          if (!err) route();
          return err;
        })));
    }

    async function showEnroll() {
      const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Admin ' + Date.now() });
      if (error) { showLogin('Could not start setup: ' + error.message); return; }
      render(h('div', { class: 'card narrow' },
        h('h1', {}, 'Set up two-step sign-in'),
        h('p', { class: 'sub' }, 'Scan this with an authenticator app (Google Authenticator, 1Password, Authy), then enter the 6-digit code it shows.'),
        h('div', { class: 'qr' }, h('img', { src: data.totp.qr_code, alt: 'QR code for authenticator app' })),
        h('p', { class: 'sub', style: 'margin-top:14px' }, 'Cannot scan? Enter this key manually: ', h('code', {}, data.totp.secret)),
        codeForm('Finish setup', async (code) => {
          const err = await verifyCode(data.id, code);
          if (!err) route();
          return err;
        })));
    }

    // ---- Dashboard --------------------------------------------------------
    let tab = 'reports';

    async function signedUrls(paths) {
      const clean = paths.filter(Boolean);
      if (!clean.length) return {};
      const { data } = await sb.storage.from('profile-photos').createSignedUrls(clean, 3600);
      const map = {};
      (data || []).forEach((d) => { if (d.signedUrl) map[d.path] = d.signedUrl; });
      return map;
    }

    function avatar(url, name) {
      return url
        ? h('img', { class: 'avatar', src: url, alt: 'Photo of ' + name })
        : h('div', { class: 'avatar', 'aria-hidden': 'true' }, '?');
    }

    async function showDashboard() {
      signoutBtn.hidden = false;
      const list = h('div', { class: 'card' }, h('div', { class: 'empty' }, 'Loading…'));
      const tabBtn = (id, label) => h('button', {
        class: tab === id ? 'active' : '',
        onclick: () => { tab = id; showDashboard(); },
      }, label);
      render(h('div', { class: 'tabs' }, tabBtn('reports', 'Reports'), tabBtn('banned', 'Banned users')), list);
      try {
        list.replaceChildren(...(tab === 'reports' ? await reportRows() : await bannedRows()));
      } catch (e) {
        list.replaceChildren(h('div', { class: 'empty' }, 'Could not load. You may need to sign in again.'));
      }
    }

    async function reportRows() {
      const { data, error } = await sb.rpc('get_pending_reports');
      if (error) throw error;
      if (!data.length) return [h('div', { class: 'empty' }, 'No pending reports. You are all caught up.')];
      const urls = await signedUrls(data.map((r) => r.reported_photo_path));
      return data.map((r) => {
        const row = h('div', { class: 'row' },
          avatar(urls[r.reported_photo_path], r.reported_name),
          h('div', { class: 'info' },
            h('strong', {}, r.reported_name),
            h('span', {}, 'Reported by ' + r.reporter_name + ' · ' + (REASON_LABELS[r.reason] || r.reason)),
            h('br'),
            h('span', {}, new Date(r.created_at).toLocaleString())),
          h('div', { class: 'actions' },
            h('button', { class: 'primary', onclick: () => showReport(r) }, 'Review')));
        return row;
      });
    }

    // ---- One report, with everything needed to decide ---------------------
    function prettyPrompt(id) {
      const s = String(id || '').replace(/[_-]+/g, ' ').trim();
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : 'Prompt';
    }

    function section(title, ...kids) {
      return h('div', { class: 'section' }, h('h2', {}, title), ...kids);
    }

    async function showReport(r) {
      signoutBtn.hidden = false;
      render(h('div', { class: 'card' }, h('div', { class: 'empty' }, 'Loading…')));
      const { data: d, error } = await sb.rpc('get_report_detail', { p_report_id: r.report_id });
      if (error || !d) { toast('Could not open that report.'); showDashboard(); return; }
      const urls = await signedUrls(d.reported.photos);

      const back = h('button', { class: 'back', onclick: () => showDashboard() }, '← All reports');
      const resolved = d.report.resolved_at;

      const photos = d.reported.photos.length
        ? h('div', { class: 'photos' }, d.reported.photos.map((p) => urls[p]
            ? h('a', { href: urls[p], target: '_blank', rel: 'noopener' }, h('img', { src: urls[p], alt: 'Profile photo of ' + d.reported.first_name }))
            : null))
        : h('p', { class: 'sub' }, 'No approved photos.');

      const facts = [
        d.reported.age != null ? d.reported.age + ' years old' : null,
        d.reported.gender ? prettyPrompt(d.reported.gender) : null,
        d.reported.city,
        d.reported.verified ? 'Verified' : null,
        'Joined ' + new Date(d.reported.joined).toLocaleDateString(),
      ].filter(Boolean).join(' · ');

      const others = d.other_reports.length
        ? h('div', { class: 'list' }, d.other_reports.map((o) => h('div', { class: 'line' },
            (REASON_LABELS[o.reason] || o.reason),
            ' · ', new Date(o.created_at).toLocaleDateString(),
            o.same_reporter ? ' · same person reporting again' : ' · different person',
            o.action_taken ? ' · ' + o.action_taken : ' · still open')))
        : h('p', { class: 'sub' }, 'No other reports against this person.');

      const chatNote = d.evidence.length
        ? 'Copied when the report was made (the last ' + d.evidence.length + ' messages). Anything unsent before that is not included.'
        : 'No saved messages. They had not matched or never chatted.';
      const chat = d.evidence.length
        ? h('div', { class: 'chat' }, d.evidence.map((m) => h('div', { class: 'bubble ' + (m.from_reported ? 'them' : 'me') },
            h('small', {}, (m.from_reported ? d.reported.first_name + ' (reported)' : d.reporter.first_name + ' (reporter)') + ' · ' + new Date(m.at).toLocaleString()),
            m.kind === 'image' ? h('em', {}, 'Sent a photo (checked automatically; not shown here)') : (m.body || ''))))
        : null;

      const reporterNote = d.reporter.reports_made + ' report' + (d.reporter.reports_made === 1 ? '' : 's') + ' made by ' + d.reporter.first_name +
        ' so far, ' + d.reporter.reports_dismissed + ' dismissed.';

      const actions = resolved
        ? h('p', { class: 'sub' }, 'Already resolved: ' + d.report.action_taken + ' on ' + new Date(resolved).toLocaleDateString())
        : h('div', { class: 'actions wide' },
            h('button', { onclick: async () => { const ok = await dismiss(r); if (ok) showDashboard(); } }, 'Dismiss report'),
            h('button', { class: 'danger', onclick: async () => { const ok = await ban(r); if (ok) showDashboard(); } }, 'Ban ' + d.reported.first_name));

      render(
        back,
        h('div', { class: 'card detail' },
          h('h1', {}, d.reported.first_name),
          h('p', { class: 'sub' }, facts),
          h('p', {}, h('strong', {}, REASON_LABELS[d.report.reason] || d.report.reason),
            ' · reported by ', d.reporter.first_name, ' on ', new Date(d.report.created_at).toLocaleString()),
          photos,
          d.reported.bio ? section('Bio', h('p', { class: 'text' }, d.reported.bio)) : null,
          d.reported.prompts.length ? section('Prompt answers', d.reported.prompts.map((p) =>
            h('div', { class: 'prompt' }, h('small', {}, prettyPrompt(p.prompt)), h('p', { class: 'text' }, p.answer)))) : null,
          section('Other reports against ' + d.reported.first_name, others),
          section('About the person reporting', h('p', { class: 'sub' }, reporterNote)),
          section('Conversation', h('p', { class: 'sub' }, chatNote), chat),
          actions));
    }

    async function bannedRows() {
      const { data, error } = await sb.rpc('get_banned_users');
      if (error) throw error;
      if (!data.length) return [h('div', { class: 'empty' }, 'Nobody is banned.')];
      const urls = await signedUrls(data.map((r) => r.photo_path));
      return data.map((u) => {
        const row = h('div', { class: 'row' },
          avatar(urls[u.photo_path], u.first_name),
          h('div', { class: 'info' },
            h('strong', {}, u.first_name),
            h('span', {}, 'Banned ' + new Date(u.banned_at).toLocaleString())),
          h('div', { class: 'actions' },
            h('button', { onclick: () => unban(u, row) }, 'Unban')));
        return row;
      });
    }

    function afterAction(row) {
      row.remove();
      const card = app.querySelector('.card');
      if (card && !card.querySelector('.row')) showDashboard();
    }

    // After a report is closed the person who made it is emailed the outcome (the function reads what was decided from
    // the database). Returns true when the email went out.
    async function tellReporter(r) {
      try {
        const { data, error } = await sb.functions.invoke('notify-reporter', { body: { reportId: r.report_id } });
        return !error && !!data && data.emailed === true;
      } catch (e) {
        return false;
      }
    }
    const reporterNote = (told) => told ? 'Reporter told.' : 'The reporter could not be told.';

    // Both return true when the action went through.
    async function dismiss(r) {
      const { error } = await sb.rpc('dismiss_report', { p_report_id: r.report_id });
      if (error) { toast('Could not dismiss. Try again.'); return false; }
      toast('Report dismissed. ' + reporterNote(await tellReporter(r)));
      return true;
    }

    // What the person is told in the ban email. Keys match the ban-reported-user function.
    const BAN_REASONS = [
      ['spam_scam', 'Spam, scams or asking for money'],
      ['harassment', 'Harassment or abuse'],
      ['inappropriate_content', 'Inappropriate content or messages'],
      ['fake_profile', 'Fake profile or photos that are not theirs'],
      ['underage', 'Content involving someone under 18'],
      ['other', 'Breaking our rules (general)'],
    ];
    // Starts on the reason the person reporting chose, as a convenience; the admin can change it.
    const REPORT_TO_BAN_REASON = {
      spam: 'spam_scam', inappropriate_content: 'inappropriate_content', fake_profile: 'fake_profile',
      harassment: 'harassment', other: 'other',
    };

    function banDialog(name, reportReason) {
      return new Promise((resolve) => {
        const dlg = document.getElementById('banbox');
        const select = document.getElementById('ban-reason');
        const skip = document.getElementById('ban-skip');
        document.getElementById('ban-title').textContent = 'Ban ' + name + '?';
        select.replaceChildren(...BAN_REASONS.map(([k, label]) => h('option', { value: k }, label)));
        select.value = REPORT_TO_BAN_REASON[reportReason] || 'other';
        skip.checked = false;
        const ok = document.getElementById('ban-ok');
        const cancel = document.getElementById('ban-cancel');
        const done = (v) => { dlg.close(); ok.onclick = cancel.onclick = null; resolve(v); };
        ok.onclick = () => done({ reason: select.value, notify: !skip.checked });
        cancel.onclick = () => done(null);
        dlg.oncancel = () => done(null);
        dlg.showModal();
      });
    }

    async function ban(r) {
      const choice = await banDialog(r.reported_name, r.reason);
      if (!choice) return false;
      const { data, error } = await sb.functions.invoke('ban-reported-user', {
        body: { reportId: r.report_id, reason: choice.reason, notify: choice.notify },
      });
      if (error) { toast('Could not ban that account. Try again.'); return false; }
      let said;
      if (data && data.emailSkipped) said = r.reported_name + ' has been banned (no email sent to them)';
      else if (data && data.emailed === false) said = r.reported_name + ' has been banned, but the email to them could not be sent';
      else if (data && data.emailed === true) said = r.reported_name + ' has been banned and emailed';
      else said = r.reported_name + ' has been banned';
      toast(said + '. ' + reporterNote(await tellReporter(r)));
      return true;
    }

    async function unban(u, row) {
      const ok = await confirmDialog('Unban ' + u.first_name + '?', 'They will be able to sign in and use Hingtam again, and we will email them to say so.', 'Unban');
      if (!ok) return;
      const { data, error } = await sb.functions.invoke('unban-user', { body: { userId: u.user_id } });
      if (error) { toast('Could not unban. Try again.'); return; }
      toast(u.first_name + ' has been unbanned' + (data && data.emailed === false ? ', but the email to them could not be sent' : ' and emailed'));
      afterAction(row);
    }

    // ---- Routing ----------------------------------------------------------
    async function route() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return showLogin();
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (aal.currentLevel !== 'aal2') { signoutBtn.hidden = false; return showMfa(); }
      showDashboard();
    }

    signoutBtn.addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });
    route();
  </script>
</body>
</html>
